[project]
name = "mqboost"
version = "1.0.0"
description = "Monotonic composite quantile gradient boost regressor"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "lightgbm>=4.6.0",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "scikit-learn>=1.6.1",
    "xgboost>=2.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
]
